[package]
name = "cowbytes"
version = "0.1.1"
authors = ["Lachlan Deakin <ljdgit@gmail.com>"]
edition = "2021"
rust-version = "1.82"
description = "Like Cow<[u8]>, but with reference-counted bytes::Bytes instead of an owned Vec<u8>"
documentation = "https://docs.rs/cowbytes"
repository = "https://github.com/LDeakin/cowbytes"
license = "MIT OR Apache-2.0"
keywords = ["bytes", "cow", "zero-copy", "buffer", "no_std"]
categories = ["data-structures", "memory-management", "no-std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
std = ["bytes/std", "serde?/std"]
serde = ["dep:serde", "serde/alloc"]

[dependencies]
bytes = { version = "1.7.0", default-features = false }
serde = { version = "1.0", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "warn"
missing_errors_doc = "warn"
